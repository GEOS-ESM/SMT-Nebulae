[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pypipe"
version = "0.1.0"
description = "Prepare and launch GEOS experiments"
readme = "README.md"
requires-python = ">=3.12"
maintainers = [
	{ name = "Charles Kropiewnicki", email = "charles.kropiewnicki@ssaihq.com" },
]
dependencies = [
	"click>=8.0",
]

[tool.setuptools]
py-modules = ["run_GEOS"]

[tool.setuptools.packages.find]
include = ["run_helpers*"]
namespaces = true

[tool.ruff]
target-version = "py312"
